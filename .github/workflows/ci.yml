name: CI

on:
  push: {}
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

      - name: Upload compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: |
            target/classes/**
            target/test-classes/**

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: compiled-classes
          path: target

      - name: Run tests
        run: mvn -B org.jacoco:jacoco-maven-plugin:prepare-agent surefire:test

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            target/surefire-reports/**
            target/jacoco.exec
            target/classes/**

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Download test output
        uses: actions/download-artifact@v4
        with:
          name: test-output
          path: target

      - name: Generate coverage report
        run: mvn -B jacoco:report

      - name: Summarize results
        run: |
          tests=0; failures=0; errors=0; skipped=0
          failing=""
          for f in target/surefire-reports/TEST-*.xml; do
            [ -e "$f" ] || continue
            t=$(grep -m1 -o 'tests="[0-9]*"' "$f" | grep -o '[0-9]*')
            fa=$(grep -m1 -o 'failures="[0-9]*"' "$f" | grep -o '[0-9]*')
            er=$(grep -m1 -o 'errors="[0-9]*"' "$f" | grep -o '[0-9]*')
            sk=$(grep -m1 -o 'skipped="[0-9]*"' "$f" | grep -o '[0-9]*')
            tests=$((tests + t)); failures=$((failures + fa)); errors=$((errors + er)); skipped=$((skipped + sk))
            if [ "$((fa + er))" -gt 0 ]; then
              cls=$(basename "$f" .xml | sed 's/^TEST-//')
              failing="${failing}- ${cls}\n"
            fi
          done

          cov="n/a"
          if [ -f target/site/jacoco/jacoco.csv ]; then
            cov=$(awk -F, 'NR>1{m+=$4;c+=$5} END{if (m+c>0) printf "%.1f%%", (c/(m+c))*100; else print "n/a"}' target/site/jacoco/jacoco.csv)
          fi

          {
            echo "## Test & Coverage Summary"
            echo ""
            echo "| Tests | Failures | Errors | Skipped | Instruction Coverage |"
            echo "|---|---|---|---|---|"
            echo "| $tests | $failures | $errors | $skipped | $cov |"
            if [ -n "$failing" ]; then
              echo ""
              echo "### Failing test classes"
              printf "%b" "$failing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/site/jacoco/**
            target/surefire-reports/**
